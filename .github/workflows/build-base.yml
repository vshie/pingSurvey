name: Build Base Image

on:
  push:
    paths:
      - 'Dockerfile.base'
      - 'Dockerfile'
  pull_request:
    paths:
      - 'Dockerfile.base'
      - 'Dockerfile'
  # Run manually
  workflow_dispatch:
  # Build base image weekly to keep it fresh
  schedule:
    - cron: '0 2 * * 0'  # Every Sunday at 2 AM UTC

# Set longer timeout for the entire workflow
env:
  ACTIONS_STEP_DEBUG: true

jobs:
  build-base-image:
    runs-on: ubuntu-latest
    timeout-minutes: 720  # 12 hours timeout for the entire job
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Branches need different dependencies (main is slim; mapmaker needs numpy/scipy for
      # post-processing), so each gets its own base tag: main -> latest, other branches -> branch name.
      # A shared tag let main's weekly scheduled build silently strip numpy from mapmaker's images.
      - name: Choose base image tag
        id: tag
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then tag=latest; else tag=$(echo "$GITHUB_REF_NAME" | tr '/' '-'); fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build and push base image (Multi-platform)
        uses: docker/build-push-action@v5
        timeout-minutes: 720  # 12 hours timeout for all architectures
        with:
          context: .
          file: ./Dockerfile.base
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ secrets.DOCKER_USERNAME }}/simplepingsurvey-base:${{ steps.tag.outputs.tag }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/simplepingsurvey-base:${{ steps.tag.outputs.tag }}
          cache-to: type=inline 