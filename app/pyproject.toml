[project]
name = "simpleSurvey"
version = "1.3.0"
description = "BlueOS extension for Ping sonar bathymetric survey data collection and visualization"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# Core dependencies (installed in the Docker base image, see Dockerfile.base)
dependencies = [
    "requests>=2.28.0",
    "flask>=2.3.0",
    "numpy>=1.26",
    "scipy>=1.13",
    "contourpy>=1.2",
    "Pillow>=10.1",
]
