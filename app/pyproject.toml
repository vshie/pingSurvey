[project]
name = "simpleSurvey"
version = "1.0.1"
description = "BlueOS extension for Ping sonar bathymetric survey data collection and visualization"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# Core dependencies (scientific packages installed via Dockerfile.base for ARM compatibility)
dependencies = [
    "requests>=2.28.0",
    "flask>=2.3.0",
    "werkzeug>=3.0.0",
]

[project.optional-dependencies]
# These are installed in the Docker base image with architecture-specific builds
contour = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "matplotlib>=3.7.0",
    "folium>=0.12.0",
    "branca>=0.4.0",
    "shapely>=2.0.0",
    "geojson>=2.5.0",
]
