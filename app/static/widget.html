<!DOCTYPE html>
<html>
<head>
    <title>Ping Survey Widget</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 8px;
            background-color: transparent;
            color: white;
            font-family: 'Roboto', Arial, sans-serif;
            font-size: 12px;
        }
        
        .widget {
            background-color: rgba(30, 30, 30, 0.95);
            border-radius: 6px;
            padding: 8px;
            min-width: 280px;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 16px);
        }
        
        .controls {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
            flex-shrink: 0;
        }
        
        .btn {
            flex: 1;
            padding: 6px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: opacity 0.2s;
        }
        
        .btn:hover {
            opacity: 0.85;
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-start {
            background-color: #4CAF50;
            color: white;
        }
        
        .btn-stop {
            background-color: #f44336;
            color: white;
        }
        
        .btn-download {
            background-color: #2196F3;
            color: white;
        }
        
        .mini-map-container {
            width: 100%;
            height: 150px;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
            flex-shrink: 0;
            position: relative;
        }
        
        #mini-map {
            width: 100%;
            height: 100%;
        }
        
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
        }
        
        .data-table td {
            padding: 3px 6px;
            border-bottom: 1px solid #333;
        }
        
        .data-table td:first-child {
            color: #888;
            width: 45%;
        }
        
        .data-table td:last-child {
            text-align: right;
            font-weight: 500;
        }
        
        .confidence-high { color: #4CAF50; }
        .confidence-medium { color: #FFC107; }
        .confidence-low { color: #f44336; }
        
        .status-bar {
            margin-top: 6px;
            padding: 4px 6px;
            background-color: rgba(0,0,0,0.3);
            border-radius: 3px;
            font-size: 10px;
            color: #888;
            text-align: center;
            flex-shrink: 0;
        }
        
        .recording-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #f44336;
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        
        /* Hide Leaflet attribution on small widget */
        .leaflet-control-attribution {
            display: none !important;
        }
    </style>
    <link href="/static/css/materialdesignicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/leaflet.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
    <div id="app">
        <div class="widget">
            <div class="controls">
                <button class="btn" :class="run ? 'btn-stop' : 'btn-start'" :disabled="isLoading" @click="toggleRun">
                    <span class="mdi" :class="run ? 'mdi-stop' : 'mdi-play'"></span>
                    {{ run ? 'Stop' : 'Start' }}
                </button>
                <button class="btn btn-download" @click="download">
                    <span class="mdi mdi-download"></span>
                    Download
                </button>
            </div>
            
            <div class="mini-map-container">
                <div id="mini-map"></div>
            </div>
            
            <table class="data-table">
                <tr>
                    <td>Depth</td>
                    <td>{{ depth }} m</td>
                </tr>
                <tr>
                    <td>Confidence</td>
                    <td :class="confidenceClass">{{ confidence }}%</td>
                </tr>
                <tr>
                    <td>Beam Width</td>
                    <td>{{ beamDiameter }} m</td>
                </tr>
                <tr>
                    <td>Heading</td>
                    <td>{{ yaw }}°</td>
                </tr>
                <tr>
                    <td>Roll / Pitch</td>
                    <td>{{ roll }}° / {{ pitch }}°</td>
                </tr>
                <tr>
                    <td>Position</td>
                    <td>{{ latitude }}, {{ longitude }}</td>
                </tr>
                <tr>
                    <td>Altitude</td>
                    <td>{{ altitude }} m</td>
                </tr>
            </table>
            
            <div class="status-bar">
                <span v-if="run" class="recording-indicator"></span>
                {{ status }}
            </div>
        </div>
    </div>

    <script src="/static/js/vue.js"></script>
    <script src="/static/js/axios.min.js"></script>
    <script src="/static/js/leaflet.js"></script>
    <script>
        new Vue({
            el: '#app',
            data() {
                return {
                    run: false,
                    isLoading: false,
                    depth: '--',
                    confidence: '--',
                    beamDiameter: '--',
                    yaw: '--',
                    roll: '--',
                    pitch: '--',
                    latitude: '--',
                    longitude: '--',
                    altitude: '--',
                    status: 'Ready',
                    intervalId: null,
                    map: null,
                    marker: null,
                    circleMarkers: [],
                    firstCoordinateReceived: false
                }
            },
            computed: {
                confidenceClass() {
                    if (this.confidence === '--') return '';
                    if (this.confidence > 95) return 'confidence-high';
                    if (this.confidence > 80) return 'confidence-medium';
                    return 'confidence-low';
                }
            },
            methods: {
                async toggleRun() {
                    this.isLoading = true;
                    try {
                        if (!this.run) {
                            const response = await fetch('/start');
                            if (!response.ok) throw new Error('Failed to start');
                            this.run = true;
                            this.status = 'Recording...';
                            this.intervalId = setInterval(this.fetchData, 500);
                        } else {
                            const response = await fetch('/stop');
                            if (!response.ok) throw new Error('Failed to stop');
                            this.run = false;
                            this.status = 'Stopped';
                            clearInterval(this.intervalId);
                        }
                    } catch (error) {
                        this.status = 'Error: ' + error.message;
                    } finally {
                        this.isLoading = false;
                    }
                },
                
                async download() {
                    try {
                        this.status = 'Downloading...';
                        const response = await fetch('/download');
                        if (!response.ok) throw new Error('No data');
                        
                        const blob = await response.blob();
                        const url = window.URL.createObjectURL(blob);
                        const timestamp = new Date().toISOString().slice(0,19).replace(/[T:]/g, '-');
                        const link = document.createElement('a');
                        link.href = url;
                        link.download = `ping_survey_${timestamp}.csv`;
                        link.click();
                        window.URL.revokeObjectURL(url);
                        
                        this.status = 'Downloaded';
                        setTimeout(() => { if (!this.run) this.status = 'Ready'; }, 2000);
                    } catch (error) {
                        this.status = 'Error: ' + error.message;
                    }
                },
                
                getDepthColor(depth) {
                    const maxDepth = 100;
                    const ratio = Math.min(depth / maxDepth, 1);
                    const r = Math.round(255 * (1 - ratio));
                    const g = Math.round(255 * (1 - ratio * 0.5));
                    const b = 255;
                    return `rgb(${r}, ${g}, ${b})`;
                },
                
                updateMap(lat, lon, depthCm, confidence) {
                    if (!this.map) return;
                    
                    if (this.marker) {
                        this.map.removeLayer(this.marker);
                    }
                    
                    this.marker = L.circleMarker([lat, lon], {
                        radius: 6,
                        fillColor: '#FF5722',
                        color: 'white',
                        weight: 2,
                        fillOpacity: 1
                    }).addTo(this.map);
                    
                    if (confidence >= 90) {
                        const depthM = depthCm / 100;
                        const radiusInMeters = depthM * Math.tan(12.5 * Math.PI / 180);
                        const circle = L.circle([lat, lon], {
                            color: 'transparent',
                            fillColor: this.getDepthColor(depthM),
                            fillOpacity: 0.6,
                            radius: radiusInMeters
                        }).addTo(this.map);
                        this.circleMarkers.push(circle);
                        
                        // Limit total circles for performance
                        if (this.circleMarkers.length > 200) {
                            const old = this.circleMarkers.shift();
                            this.map.removeLayer(old);
                        }
                    }
                    
                    if (!this.firstCoordinateReceived) {
                        this.firstCoordinateReceived = true;
                        this.map.setView([lat, lon], 18);
                    }
                },
                
                async fetchData() {
                    try {
                        const response = await axios.get('/data');
                        const data = response.data;
                        
                        if (data && Array.isArray(data) && data.length >= 8) {
                            const hasNewFormat = data.length >= 11;
                            const depthCm = data[3];
                            const depthM = depthCm / 100;
                            
                            this.depth = depthM.toFixed(2);
                            this.confidence = data[4];
                            this.yaw = data[5];
                            this.roll = hasNewFormat ? data[6] : '--';
                            this.pitch = hasNewFormat ? data[7] : '--';
                            
                            const lat = hasNewFormat ? data[8] : data[6];
                            const lon = hasNewFormat ? data[9] : data[7];
                            this.latitude = Number(lat).toFixed(6);
                            this.longitude = Number(lon).toFixed(6);
                            this.altitude = hasNewFormat ? Number(data[10]).toFixed(1) : '--';
                            
                            const angleRad = (12.5 * Math.PI) / 180;
                            this.beamDiameter = (2 * Math.tan(angleRad) * depthM).toFixed(2);
                            
                            this.updateMap(Number(lat), Number(lon), depthCm, data[4]);
                        }
                    } catch (error) {
                        // Silent fail during polling
                    }
                },
                
                async checkStatus() {
                    try {
                        const response = await axios.get('/status');
                        if (response.data.logging_active) {
                            this.run = true;
                            this.status = 'Recording...';
                            this.intervalId = setInterval(this.fetchData, 500);
                        } else if (response.data.simulation_active) {
                            this.run = false;
                            this.status = 'Simulation running...';
                            this.intervalId = setInterval(this.fetchData, 200);
                        }
                    } catch (error) {
                        // Silent fail
                    }
                },
                
                initMap() {
                    this.map = L.map('mini-map', {
                        zoomControl: false,
                        attributionControl: false,
                        tap: true,
                        dragging: true,
                        touchZoom: 'center'
                    }).setView([0, 0], 2);
                    
                    const tileUrl = `/tiles/{z}/{x}/{y}.png?source=google`;
                    L.tileLayer(tileUrl, {
                        maxZoom: 19,
                        errorTileUrl: 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'
                    }).addTo(this.map);
                }
            },
            mounted() {
                this.$nextTick(() => {
                    setTimeout(() => {
                        this.initMap();
                        this.checkStatus();
                    }, 200);
                });
            },
            beforeDestroy() {
                if (this.intervalId) clearInterval(this.intervalId);
            }
        });
    </script>
</body>
</html>
