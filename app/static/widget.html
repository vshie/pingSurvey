<!DOCTYPE html>
<html>
<head>
    <title>Ping Survey Widget</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            background-color: transparent;
        }

        body {
            padding: 6px;
            font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            font-size: 13px;
            color: #33322e;
        }

        /* Monospace for numeric readouts (ledger feel) */
        .mono {
            font-family: 'SF Mono', 'Roboto Mono', Menlo, Consolas, monospace;
            font-variant-numeric: tabular-nums;
        }

        /* Notebook paper card */
        .widget {
            position: relative;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 12px);
            min-width: 240px;
            padding: 10px 12px 10px 26px;
            background-color: #f7f4ea;
            background-image:
                repeating-linear-gradient(
                    to bottom,
                    transparent 0,
                    transparent 27px,
                    #dfe6ef 27px,
                    #dfe6ef 28px
                );
            border: 1px solid #e2ddce;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
            overflow: hidden;
        }

        /* Red margin rule, like a paper notebook */
        .widget::before {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            left: 18px;
            width: 1.5px;
            background-color: #e6a9a0;
            opacity: 0.8;
        }

        .nb-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-shrink: 0;
            margin-bottom: 8px;
        }

        .nb-title {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: #2c2b27;
        }

        .nb-title .sub {
            font-weight: 400;
            font-size: 11px;
            color: #9a927f;
            margin-left: 6px;
        }

        .rec-state {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            color: #9a927f;
        }

        .recording-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #d64545;
            border-radius: 50%;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .controls {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        .btn {
            flex: 1;
            padding: 7px 10px;
            border: 1px solid transparent;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: opacity 0.15s;
        }

        .btn:hover { opacity: 0.88; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-start { background-color: #3f8f4f; color: #fff; }
        .btn-stop { background-color: #c0392b; color: #fff; }
        .btn-download {
            background-color: transparent;
            color: #2c5b8f;
            border-color: #b9c6d8;
        }

        /* Hero readouts: the headline numbers */
        .hero {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        .hero-card {
            flex: 1;
            background-color: rgba(255, 255, 255, 0.55);
            border: 1px solid #e4dece;
            border-radius: 5px;
            padding: 7px 10px;
        }

        .hero-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #9a927f;
        }

        .hero-value {
            font-size: 26px;
            font-weight: 700;
            line-height: 1.15;
            color: #23405f;
        }

        .hero-unit {
            font-size: 13px;
            font-weight: 500;
            color: #7d8ba0;
            margin-left: 2px;
        }

        /* Ruled ledger rows for the remaining data */
        .readings {
            flex: 1;
            overflow-y: auto;
        }

        .reading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 28px;
            border-bottom: 1px solid rgba(180, 168, 140, 0.28);
        }

        .reading .k {
            color: #8a8267;
            font-size: 12px;
        }

        .reading .v {
            font-weight: 600;
            font-size: 13px;
            color: #33322e;
        }

        .confidence-high { color: #2e7d32; }
        .confidence-medium { color: #b8860b; }
        .confidence-low { color: #c0392b; }

        .status-bar {
            margin-top: 8px;
            padding: 5px 8px;
            background-color: rgba(255, 255, 255, 0.5);
            border: 1px solid #e4dece;
            border-radius: 4px;
            font-size: 10px;
            color: #9a927f;
            text-align: center;
            flex-shrink: 0;
        }
    </style>
    <link href="/static/css/materialdesignicons.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
    <div id="app">
        <div class="widget">
            <div class="nb-header">
                <div class="nb-title">Ping Survey<span class="sub">log</span></div>
                <div class="rec-state">
                    <span v-if="run" class="recording-indicator"></span>
                    <span v-if="run">REC</span>
                    <span v-else>idle</span>
                </div>
            </div>

            <div class="controls">
                <button class="btn" :class="run ? 'btn-stop' : 'btn-start'" :disabled="isLoading" @click="toggleRun">
                    <span class="mdi" :class="run ? 'mdi-stop' : 'mdi-play'"></span>
                    {{ run ? 'Stop' : 'Start' }}
                </button>
                <button class="btn btn-download" @click="download">
                    <span class="mdi mdi-download"></span>
                    Download
                </button>
            </div>

            <div class="hero">
                <div class="hero-card">
                    <div class="hero-label">Depth</div>
                    <div class="hero-value mono">{{ depth }}<span class="hero-unit">m</span></div>
                </div>
                <div class="hero-card">
                    <div class="hero-label">Beam Width</div>
                    <div class="hero-value mono">{{ beamDiameter }}<span class="hero-unit">m</span></div>
                </div>
            </div>

            <div class="readings">
                <div class="reading">
                    <span class="k">Confidence</span>
                    <span class="v mono" :class="confidenceClass">{{ confidence }}<template v-if="confidence !== '--'">%</template></span>
                </div>
                <div class="reading">
                    <span class="k">Heading</span>
                    <span class="v mono">{{ yaw }}<template v-if="yaw !== '--'">&deg;</template></span>
                </div>
                <div class="reading">
                    <span class="k">Roll / Pitch</span>
                    <span class="v mono">{{ roll }}&deg; / {{ pitch }}&deg;</span>
                </div>
                <div class="reading">
                    <span class="k">Altitude</span>
                    <span class="v mono">{{ altitude }}<template v-if="altitude !== '--'">m</template></span>
                </div>
                <div class="reading">
                    <span class="k">Latitude</span>
                    <span class="v mono">{{ latitude }}</span>
                </div>
                <div class="reading">
                    <span class="k">Longitude</span>
                    <span class="v mono">{{ longitude }}</span>
                </div>
            </div>

            <div class="status-bar">{{ status }}</div>
        </div>
    </div>

    <script src="/static/js/vue.js"></script>
    <script src="/static/js/axios.min.js"></script>
    <script>
        new Vue({
            el: '#app',
            data() {
                return {
                    run: false,
                    isLoading: false,
                    depth: '--',
                    confidence: '--',
                    beamDiameter: '--',
                    yaw: '--',
                    roll: '--',
                    pitch: '--',
                    latitude: '--',
                    longitude: '--',
                    altitude: '--',
                    status: 'Ready',
                    intervalId: null
                }
            },
            computed: {
                confidenceClass() {
                    if (this.confidence === '--') return '';
                    if (this.confidence > 95) return 'confidence-high';
                    if (this.confidence > 80) return 'confidence-medium';
                    return 'confidence-low';
                }
            },
            methods: {
                async toggleRun() {
                    this.isLoading = true;
                    try {
                        if (!this.run) {
                            const response = await fetch('/start');
                            if (!response.ok) throw new Error('Failed to start');
                            this.run = true;
                            this.status = 'Recording...';
                            this.intervalId = setInterval(this.fetchData, 500);
                        } else {
                            const response = await fetch('/stop');
                            if (!response.ok) throw new Error('Failed to stop');
                            this.run = false;
                            this.status = 'Stopped';
                            clearInterval(this.intervalId);
                        }
                    } catch (error) {
                        this.status = 'Error: ' + error.message;
                    } finally {
                        this.isLoading = false;
                    }
                },

                async download() {
                    try {
                        this.status = 'Downloading...';
                        const response = await fetch('/download');
                        if (!response.ok) throw new Error('No data');

                        const blob = await response.blob();
                        const url = window.URL.createObjectURL(blob);
                        const timestamp = new Date().toISOString().slice(0,19).replace(/[T:]/g, '-');
                        const link = document.createElement('a');
                        link.href = url;
                        link.download = `ping_survey_${timestamp}.csv`;
                        link.click();
                        window.URL.revokeObjectURL(url);

                        this.status = 'Downloaded';
                        setTimeout(() => { if (!this.run) this.status = 'Ready'; }, 2000);
                    } catch (error) {
                        this.status = 'Error: ' + error.message;
                    }
                },

                async fetchData() {
                    try {
                        const response = await axios.get('/data');
                        const data = response.data;

                        if (data && Array.isArray(data) && data.length >= 8) {
                            const hasNewFormat = data.length >= 11;
                            const depthCm = data[3];
                            const depthM = depthCm / 100;

                            this.depth = depthM.toFixed(2);
                            this.confidence = data[4];
                            this.yaw = Number(data[5]).toFixed(1);
                            this.roll = hasNewFormat ? Number(data[6]).toFixed(1) : '--';
                            this.pitch = hasNewFormat ? Number(data[7]).toFixed(1) : '--';

                            const lat = hasNewFormat ? data[8] : data[6];
                            const lon = hasNewFormat ? data[9] : data[7];
                            const validFix = Number.isFinite(Number(lat)) && Number.isFinite(Number(lon)) &&
                                (Math.abs(lat) > 0.0001 || Math.abs(lon) > 0.0001);
                            this.latitude = validFix ? Number(lat).toFixed(6) : '--';
                            this.longitude = validFix ? Number(lon).toFixed(6) : '--';
                            this.altitude = hasNewFormat ? Number(data[10]).toFixed(1) : '--';

                            const angleRad = (12.5 * Math.PI) / 180;
                            this.beamDiameter = (2 * Math.tan(angleRad) * depthM).toFixed(2);
                        }
                    } catch (error) {
                        // Silent fail during polling
                    }
                },

                async checkStatus() {
                    try {
                        const response = await axios.get('/status');
                        if (response.data.logging_active) {
                            this.run = true;
                            this.status = 'Recording...';
                            this.intervalId = setInterval(this.fetchData, 500);
                        } else if (response.data.simulation_active) {
                            this.run = false;
                            this.status = 'Simulation running...';
                            this.intervalId = setInterval(this.fetchData, 200);
                        }
                    } catch (error) {
                        // Silent fail
                    }
                }
            },
            mounted() {
                this.checkStatus();
            },
            beforeDestroy() {
                if (this.intervalId) clearInterval(this.intervalId);
            }
        });
    </script>
</body>
</html>
